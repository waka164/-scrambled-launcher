<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SCRAMBLED">
<link rel="manifest" href="/manifest.webmanifest?v=7">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v3.png?v=7">
<link rel="icon" type="image/png" href="/icons/icon-192-v3.png?v=7">
<title>SCRAMBLED</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#101429;background:#fff;overflow:hidden;-webkit-tap-highlight-color:transparent}.blob{position:fixed;width:48vw;height:48vw;border-radius:50%;filter:blur(44px);opacity:.48;pointer-events:none}.b1{left:-20vw;top:-18vw;background:#e8d7ff}.b2{right:-18vw;top:-18vw;background:#ffd8f0}.b3{left:-22vw;bottom:-18vw;background:#d5f2ff}.b4{right:-18vw;bottom:-20vw;background:#ffeec3}main{position:relative;z-index:2;min-height:100dvh;padding:max(24px,env(safe-area-inset-top)) 28px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.icon{width:118px;height:118px;border-radius:27px;box-shadow:0 18px 50px rgba(36,42,82,.12),0 2px 8px rgba(36,42,82,.08);margin-bottom:28px}h1{margin:0;font-size:28px;letter-spacing:.14em;font-weight:800}.sub{margin:11px 0 26px;color:#74798d;font-size:14px;letter-spacing:.08em}.install{max-width:330px;color:#5f6477;font-size:15px;line-height:1.65;margin:0 0 22px}.button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:14px 20px;font:inherit;font-weight:700;color:#101429;background:rgba(255,255,255,.84);box-shadow:0 8px 30px rgba(36,42,82,.1);text-decoration:none}.progress{width:min(260px,72vw);height:4px;border-radius:999px;background:#eef0f7;overflow:hidden;margin-bottom:15px}.bar{width:0;height:100%;border-radius:999px;background:linear-gradient(90deg,#ff64bd,#ffd35c,#6bddc7,#6a71ff);animation:load .95s cubic-bezier(.22,.8,.22,1) forwards}@keyframes load{to{width:100%}}.status{margin:0;color:#7a8095;font-size:13px}.launch-only{display:none}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<main>
<img class="icon" src="/icons/icon-512-v3.png?v=7" alt="SCRAMBLED">
<h1>SCRAMBLED</h1>
<p class="sub">Atsueigo</p>
<div id="browserMode">
<p class="install">このページをSafariで開いたまま、共有ボタンから「ホーム画面に追加」してください。追加後のアイコンから開くと、自動でSCRAMBLEDへ移動します。</p>
<a class="button" href="https://watch.atsueigo.com/products/scrambled">今すぐSCRAMBLEDを開く</a>
</div>
<div id="launchMode" class="launch-only">
<div class="progress"><div class="bar"></div></div>
<p class="status">Opening SCRAMBLED…</p>
</div>
</main>
<script>
const TARGET='https://watch.atsueigo.com/products/scrambled';
const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
if (standalone) {
  document.getElementById('browserMode').style.display='none';
  document.getElementById('launchMode').style.display='block';
  setTimeout(()=>location.replace(TARGET),700);
}
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}
</script>
</body>
</html>
